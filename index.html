<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANOS AI Oppus2 — Messenger</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #18191a;
            color: #e4e6eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .messenger-container {
            width: 100%;
            max-width: 480px;
            height: 90vh;
            background-color: #242526;
            border-radius: 16px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #3a3b3c;
        }

        /* En-tête style Messenger */
        .chat-header {
            padding: 14px 16px;
            background-color: #242526;
            border-bottom: 1px solid #393a3b;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-container {
            position: relative;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0084ff, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            font-size: 16px;
        }

        .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            background-color: #31a24c;
            border-radius: 50%;
            border: 2px solid #242526;
        }

        .details {
            display: flex;
            flex-direction: column;
        }

        .name {
            font-size: 16px;
            font-weight: 600;
            color: #e4e6eb;
        }

        .subtitle {
            font-size: 12px;
            color: #b0b3b8;
        }

        .badge-souverain {
            background: rgba(0, 132, 255, 0.15);
            color: #2d88ff;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(0, 132, 255, 0.3);
        }

        /* Zone de messages */
        .chat-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #18191a;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .message-wrapper.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-wrapper.ai {
            align-self: flex-start;
            align-items: flex-start;
        }

        .bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14.5px;
            line-height: 1.4;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message-wrapper.user .bubble {
            background-color: #0084ff;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message-wrapper.ai .bubble {
            background-color: #3a3b3c;
            color: #e4e6eb;
            border-bottom-left-radius: 4px;
        }

        /* Indicateur de saisie (3 petits points) */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 10px 14px;
            background-color: #3a3b3c;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            width: fit-content;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background-color: #b0b3b8;
            border-radius: 50%;
            animation: blink 1.4s infiniteSync both;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.1); }
        }

        /* Zone de saisie */
        .chat-footer {
            padding: 12px;
            background-color: #242526;
            border-top: 1px solid #393a3b;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-box {
            flex: 1;
            background-color: #3a3b3c;
            border: none;
            border-radius: 20px;
            padding: 10px 16px;
            color: #e4e6eb;
            font-size: 14px;
            outline: none;
        }

        .input-box::placeholder {
            color: #b0b3b8;
        }

        .send-btn {
            background-color: #0084ff;
            border: none;
            color: white;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .send-btn:active {
            transform: scale(0.92);
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: white;
        }
    </style>
</head>
<body>

<div class="messenger-container">
    <!-- En-tête -->
    <div class="chat-header">
        <div class="user-info">
            <div class="avatar-container">
                <div class="avatar">AN</div>
                <div class="status-dot"></div>
            </div>
            <div class="details">
                <span class="name">ANOS AI Oppus2</span>
                <span class="subtitle">Data Core (Bamako, Mali)</span>
            </div>
        </div>
        <div class="badge-souverain">3B Souverain</div>
    </div>

    <!-- Corps de la discussion -->
    <div class="chat-body" id="chatBody">
        <div class="message-wrapper ai">
            <div class="bubble">Bonjour ! Je suis **ANOS AI Oppus2**, l'intelligence artificielle souveraine développée par Data Core. Comment puis-je vous aider ?</div>
        </div>
    </div>

    <!-- Zone de saisie -->
    <div class="chat-footer">
        <input type="text" id="userInput" class="input-box" placeholder="Écrivez un message..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
            </svg>
        </button>
    </div>
</div>

<script>
    // Configuration de l'API Hugging Face
    const MODEL_ID = "maletsidibeOS/anos_ai_oppus2";
    // ATTENTION: Insérez votre jeton API Hugging Face ci-dessous
    const HF_TOKEN = " VOTRE_HF_TOKEN_ICI "; 

    const chatBody = document.getElementById("chatBody");
    const userInput = document.getElementById("userInput");

    // Historique des conversations
    let conversationHistory = [
        {
            role: "system",
            content: "Vous êtes ANOS AI Oppus2, l'intelligence artificielle souveraine développée par Data Core à Bamako (Mali). Vous répondez de manière courtoise, claire, précise et structurée."
        }
    ];

    function scrollToBottom() {
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    function appendMessage(sender, text) {
        const wrapper = document.createElement("div");
        wrapper.className = `message-wrapper ${sender}`;

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        wrapper.appendChild(bubble);
        chatBody.appendChild(wrapper);
        scrollToBottom();
        return bubble;
    }

    function showTypingIndicator() {
        const wrapper = document.createElement("div");
        wrapper.className = "message-wrapper ai";
        wrapper.id = "typingIndicator";

        const indicator = document.createElement("div");
        indicator.className = "typing-indicator";
        indicator.innerHTML = `
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        `;

        wrapper.appendChild(indicator);
        chatBody.appendChild(wrapper);
        scrollToBottom();
    }

    function removeTypingIndicator() {
        const indicator = document.getElementById("typingIndicator");
        if (indicator) {
            indicator.remove();
        }
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // Effacer le champ
        userInput.value = "";

        // Afficher le message utilisateur
        appendMessage("user", text);
        conversationHistory.push({ role: "user", content: text });

        // Afficher l'animation d'écriture
        showTypingIndicator();

        try {
            // Appel direct à l'API d'inférence Hugging Face
            const response = await fetch(`https://api-inference.huggingface.co/models/${MODEL_ID}/v1/chat/completions`, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${HF_TOKEN}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: MODEL_ID,
                    messages: conversationHistory,
                    max_tokens: 1024,
                    temperature: 0.7
                })
            });

            removeTypingIndicator();

            if (!response.ok) {
                const errorData = await response.json();
                appendMessage("ai", `⚠️ Erreur : ${errorData.error || "Impossible de contacter le modèle."}`);
                return;
            }

            const data = await response.json();
            const aiMessage = data.choices[0].message.content;

            // Ajouter la réponse du modèle à l'interface et à l'historique
            appendMessage("ai", aiMessage);
            conversationHistory.push({ role: "assistant", content: aiMessage });

        } catch (error) {
            removeTypingIndicator();
            appendMessage("ai", "⚠️ Une erreur réseau s'est produite. Vérifiez votre connexion ou votre jeton HF_TOKEN.");
            console.error(error);
        }
    }
</script>

</body>
</html>
