<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANOS AI OPUS</title>
    
    <!-- Configuration pour transformer en Application (PWA / Mobile / Desktop) -->
    <link rel="icon" type="image/jpg" href="./Anos.JPG">
    <link rel="apple-touch-icon" type="image/jpg" href="./Anos.JPG">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0e27">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ANOS AI">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0a0e27;
            color: #e4e6eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: rgba(15, 23, 41, 0.95);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(88, 126, 255, 0.2);
        }

        @media (min-width: 768px) {
            .app-container {
                height: 90vh;
                border-radius: 20px;
            }
        }

        /* === APP HEADER === */
        .app-header {
            padding: 16px 20px;
            background: linear-gradient(135deg, rgba(30, 35, 70, 0.9) 0%, rgba(20, 25, 50, 0.9) 100%);
            border-bottom: 1px solid rgba(88, 126, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-container {
            position: relative;
            width: 42px;
            height: 42px;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(88, 126, 255, 0.4);
        }

        .status-pulse {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            background-color: #00ff88;
            border-radius: 50%;
            border: 2px solid #0a0e27;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 12px rgba(0, 255, 136, 0.6), 0 0 20px rgba(0, 255, 136, 0.3); }
            50% { box-shadow: 0 0 8px rgba(0, 255, 136, 0.4), 0 0 15px rgba(0, 255, 136, 0.2); }
        }

        .header-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #587eff 0%, #7c9eff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .header-subtitle {
            font-size: 12px;
            color: #8b92a3;
            font-weight: 500;
        }

        .header-badge {
            background: linear-gradient(135deg, rgba(88, 126, 255, 0.2) 0%, rgba(124, 158, 255, 0.1) 100%);
            color: #7c9eff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid rgba(88, 126, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(88, 126, 255, 0.2);
        }

        /* === CHAT BODY === */
        .chat-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: linear-gradient(to bottom, rgba(10, 14, 39, 0.5) 0%, rgba(15, 23, 41, 0.5) 100%);
        }

        .message-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .message-wrapper.user { justify-content: flex-end; }
        .message-wrapper.ai { justify-content: flex-start; }

        .message-bubble {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 14.5px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message-wrapper.user .message-bubble {
            background: linear-gradient(135deg, #587eff 0%, #7c9eff 100%);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 8px 20px rgba(88, 126, 255, 0.25);
        }

        .message-wrapper.ai .message-bubble {
            background: linear-gradient(135deg, rgba(88, 126, 255, 0.15) 0%, rgba(124, 158, 255, 0.08) 100%);
            color: #e4e6eb;
            border: 1px solid rgba(88, 126, 255, 0.25);
            border-bottom-left-radius: 4px;
        }

        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(88, 126, 255, 0.15) 0%, rgba(124, 158, 255, 0.08) 100%);
            border: 1px solid rgba(88, 126, 255, 0.25);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            width: fit-content;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: linear-gradient(135deg, #587eff, #7c9eff);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { opacity: 0.4; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-8px); }
        }

        /* === CHAT FOOTER === */
        .chat-footer {
            padding: 16px 24px;
            background: linear-gradient(135deg, rgba(30, 35, 70, 0.8) 0%, rgba(20, 25, 50, 0.8) 100%);
            border-top: 1px solid rgba(88, 126, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(88, 126, 255, 0.08);
            border: 1px solid rgba(88, 126, 255, 0.2);
            border-radius: 24px;
            padding: 2px 4px;
        }

        .input-box {
            flex: 1;
            background: none;
            border: none;
            padding: 12px 16px;
            color: #e4e6eb;
            font-size: 14px;
            outline: none;
        }

        .send-btn {
            background: linear-gradient(135deg, #587eff 0%, #7c9eff 100%);
            border: none;
            color: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <div class="header-left">
            <div class="logo-container">
                <img src="./Anos.png.JPG" alt="ANOS AI Logo">
                <div class="status-pulse"></div>
            </div>
            <div class="header-info">
                <div class="header-title">ANOS AI OPUS</div>
                <div class="header-subtitle">Intelligence Souveraine Avancée</div>
            </div>
        </div>
        <div class="header-badge">⚡ POWERED UP</div>
    </div>

    <div class="chat-body" id="chatBody">
        <div class="message-group">
            <div class="message-wrapper ai">
                <div class="message-bubble">
                    🌟 Bienvenue dans ANOS AI OPUS — votre compagnon intelligent souverain. Je suis prêt à analyser, créer, et résoudre vos défis les plus complexes. Que puis-je faire pour vous ?
                </div>
            </div>
        </div>
    </div>

    <div class="chat-footer">
        <div class="input-wrapper">
            <input 
                type="text" 
                id="userInput" 
                class="input-box" 
                placeholder="Posez une question, donnez un ordre..." 
                onkeydown="if(event.key==='Enter' && !event.shiftKey) sendMessage()"
            >
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">⚡</button>
        </div>
    </div>
</div>

<script>
    const MODEL_ID = "maletsidibeOS/anos_ai_oppus2";
    const HF_TOKEN = "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";

    const chatBody = document.getElementById("chatBody");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    let conversationHistory = [
        {
            role: "system",
            content: "Vous êtes ANOS AI OPUS, une intelligence artificielle souveraine développée par Data Core à Bamako (Mali)."
        }
    ];

    function scrollToBottom() {
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    function appendMessage(sender, text) {
        const messageGroup = document.createElement("div");
        messageGroup.className = "message-group";

        const wrapper = document.createElement("div");
        wrapper.className = `message-wrapper ${sender}`;

        const bubble = document.createElement("div");
        bubble.className = "message-bubble";
        bubble.textContent = text;

        wrapper.appendChild(bubble);
        messageGroup.appendChild(wrapper);
        chatBody.appendChild(messageGroup);
        scrollToBottom();
    }

    function showTypingIndicator() {
        const messageGroup = document.createElement("div");
        messageGroup.className = "message-group";
        messageGroup.id = "typingIndicator";

        const wrapper = document.createElement("div");
        wrapper.className = "message-wrapper ai";

        const indicator = document.createElement("div");
        indicator.className = "typing-indicator";
        indicator.innerHTML = `
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        `;

        wrapper.appendChild(indicator);
        messageGroup.appendChild(wrapper);
        chatBody.appendChild(messageGroup);
        scrollToBottom();
    }

    function removeTypingIndicator() {
        const indicator = document.getElementById("typingIndicator");
        if (indicator) indicator.remove();
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        userInput.value = "";
        sendBtn.disabled = true;

        appendMessage("user", text);
        conversationHistory.push({ role: "user", content: text });

        showTypingIndicator();

        try {
            const response = await fetch(`https://api-inference.huggingface.co/models/${MODEL_ID}/v1/chat/completions`, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${HF_TOKEN}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: MODEL_ID,
                    messages: conversationHistory,
                    max_tokens: 2048,
                    temperature: 0.7
                })
            });

            removeTypingIndicator();

            if (!response.ok) {
                const errorData = await response.json();
                appendMessage("ai", `⚠️ Erreur: ${errorData.error?.message || "Impossible de contacter le modèle."}`);
                sendBtn.disabled = false;
                return;
            }

            const data = await response.json();
            const aiMessage = data.choices[0].message.content;

            appendMessage("ai", aiMessage);
            conversationHistory.push({ role: "assistant", content: aiMessage });

        } catch (error) {
            removeTypingIndicator();
            appendMessage("ai", "⚠️ Erreur réseau: Vérifiez votre connexion.");
            console.error(error);
        } finally {
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    // Enregistrement du Service Worker pour le mode Application (PWA)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Registration error', err));
    }
</script>

</body>
</html>
