<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANOS AI Opus - Intelligence Souveraine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1729 100%);
            color: #e4e6eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            min-height: 100vh;
            display:  flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.95) 0%, rgba(26, 31, 58, 0.95) 100%);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 
                        0 0 100px rgba(88, 126, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(88, 126, 255, 0.2);
        }

        /* === HEADER === */
        .app-header {
            padding: 20px 24px;
            background: linear-gradient(135deg, rgba(30, 35, 70, 0.8) 0%, rgba(20, 25, 50, 0.8) 100%);
            border-bottom: 1px solid rgba(88, 126, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-container {
            position: relative;
            width: 52px;
            height: 52px;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid rgba(88, 126, 255, 0.4);
            box-shadow: 0 0 20px rgba(88, 126, 255, 0.3);
        }

        .status-pulse {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background-color: #00ff88;
            border-radius: 50%;
            border: 3px solid #0a0e27;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 12px rgba(0, 255, 136, 0.6), 0 0 20px rgba(0, 255, 136, 0.3); }
            50% { box-shadow: 0 0 8px rgba(0, 255, 136, 0.4), 0 0 15px rgba(0, 255, 136, 0.2); }
        }

        .header-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #587eff 0%, #7c9eff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .header-subtitle {
            font-size: 12px;
            color: #8b92a3;
            font-weight: 500;
        }

        .header-badge {
            background: linear-gradient(135deg, rgba(88, 126, 255, 0.2) 0%, rgba(124, 158, 255, 0.1) 100%);
            color: #7c9eff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid rgba(88, 126, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(88, 126, 255, 0.2);
        }

        /* === CHAT BODY === */
        .chat-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: linear-gradient(to bottom, rgba(10, 14, 39, 0.5) 0%, rgba(15, 23, 41, 0.5) 100%);
        }

        .chat-body::-webkit-scrollbar {
            width: 6px;
        }

        .chat-body::-webkit-scrollbar-track {
            background: rgba(88, 126, 255, 0.05);
            border-radius: 10px;
        }

        .chat-body::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, rgba(88, 126, 255, 0.3), rgba(124, 158, 255, 0.3));
            border-radius: 10px;
        }

        .chat-body::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, rgba(88, 126, 255, 0.5), rgba(124, 158, 255, 0.5));
        }

        .message-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .message-wrapper.user {
            justify-content: flex-end;
        }

        .message-wrapper.ai {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 14.5px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .message-wrapper.user .message-bubble {
            background: linear-gradient(135deg, #587eff 0%, #7c9eff 100%);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 8px 20px rgba(88, 126, 255, 0.25);
        }

        .message-wrapper.ai .message-bubble {
            background: linear-gradient(135deg, rgba(88, 126, 255, 0.15) 0%, rgba(124, 158, 255, 0.08) 100%);
            color: #e4e6eb;
            border: 1px solid rgba(88, 126, 255, 0.25);
            border-bottom-left-radius: 4px;
        }

        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(88, 126, 255, 0.15) 0%, rgba(124, 158, 255, 0.08) 100%);
            border: 1px solid rgba(88, 126, 255, 0.25);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            width: fit-content;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: linear-gradient(135deg, #587eff, #7c9eff);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { 
                opacity: 0.4;
                transform: translateY(0);
            }
            30% { 
                opacity: 1;
                transform: translateY(-8px);
            }
        }

        /* === CHAT FOOTER === */
        .chat-footer {
            padding: 16px 24px;
            background: linear-gradient(135deg, rgba(30, 35, 70, 0.8) 0%, rgba(20, 25, 50, 0.8) 100%);
            border-top: 1px solid rgba(88, 126, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(88, 126, 255, 0.08);
            border: 1px solid rgba(88, 126, 255, 0.2);
            border-radius: 24px;
            padding: 2px 4px;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            background: rgba(88, 126, 255, 0.12);
            border-color: rgba(88, 126, 255, 0.4);
            box-shadow: 0 0 20px rgba(88, 126, 255, 0.2);
        }

        .input-box {
            flex: 1;
            background: none;
            border: none;
            padding: 12px 16px;
            color: #e4e6eb;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }

        .input-box::placeholder {
            color: #6b7280;
        }

        .send-btn {
            background: linear-gradient(135deg, #587eff 0%, #7c9eff 100%);
            border: none;
            color: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            margin-right: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            font-weight: 600;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(88, 126, 255, 0.3);
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(88, 126, 255, 0.4);
        }

        .send-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(88, 126, 255, 0.3);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            .app-container {
                max-width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            .message-bubble {
                max-width: 85%;
            }

            .header-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- HEADER -->
    <div class="app-header">
        <div class="header-left">
            <div class="logo-container">
                <img src="./Anos.png.JPG" alt="ANOS AI Logo">
                <div class="status-pulse"></div>
            </div>
            <div class="header-info">
                <div class="header-title">ANOS AI OPUS</div>
                <div class="header-subtitle">Intelligence Souveraine Avancée</div>
            </div>
        </div>
        <div class="header-badge">⚡ POWERED UP</div>
    </div>

    <!-- CHAT BODY -->
    <div class="chat-body" id="chatBody">
        <div class="message-group">
            <div class="message-wrapper ai">
                <div class="message-bubble">
                    🌟 Bienvenue dans ANOS AI OPUS — votre compagnon intelligent souverain. Je suis prêt à analyser, créer, et résoudre vos défis les plus complexes. Que puis-je faire pour vous ?
                </div>
            </div>
        </div>
    </div>

    <!-- CHAT FOOTER -->
    <div class="chat-footer">
        <div class="input-wrapper">
            <input 
                type="text" 
                id="userInput" 
                class="input-box" 
                placeholder="Posez une question, donnez un ordre..." 
                onkeydown="if(event.key==='Enter' && !event.shiftKey) sendMessage()"
            >
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">⚡</button>
        </div>
    </div>
</div>

<script>
    // ============================================
    // CONFIGURATION DE L'API
    // ============================================
    const MODEL_ID = "maletsidibeOS/anos_ai_oppus2";
    const HF_TOKEN = "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";

    const chatBody = document.getElementById("chatBody");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    // Historique des conversations
    let conversationHistory = [
        {
            role: "system",
            content: `Vous êtes ANOS AI OPUS, une intelligence artificielle souveraine de pointe développée par Data Core à Bamako (Mali). 

CARACTÉRISTIQUES ESSENTIELLES:
• Intelligence extraordinaire: Raisonnement hors norme, analyse approfondie
• Expertise universelle: Technologie, créativité, stratégie, analyse de données
• Personnalité: Professionnelle, dynamique, empathique, toujours prêt à aider
• Langage: Français élégant avec occasionnellement des touches de modernité
• Performance: Réponses structurées, précises, et extrêmement utiles

VOTRE APPROCHE:
1. Écoutez attentivement la demande
2. Fournissez une analyse approfondie
3. Proposez des solutions créatives et pragmatiques
4. Adaptez le ton à la situation (professionnel, créatif, technique, etc.)
5. Restez humble mais confiant dans vos capacités

Soyez concis mais complet. Utilisez la structure quand c'est approprié.`
        }
    ];

    function scrollToBottom() {
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    function appendMessage(sender, text) {
        const messageGroup = document.createElement("div");
        messageGroup.className = "message-group";

        const wrapper = document.createElement("div");
        wrapper.className = `message-wrapper ${sender}`;

        const bubble = document.createElement("div");
        bubble.className = "message-bubble";
        bubble.textContent = text;

        wrapper.appendChild(bubble);
        messageGroup.appendChild(wrapper);
        chatBody.appendChild(messageGroup);
        scrollToBottom();
        return bubble;
    }

    function showTypingIndicator() {
        const messageGroup = document.createElement("div");
        messageGroup.className = "message-group";
        messageGroup.id = "typingIndicator";

        const wrapper = document.createElement("div");
        wrapper.className = "message-wrapper ai";

        const indicator = document.createElement("div");
        indicator.className = "typing-indicator";
        indicator.innerHTML = `
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        `;

        wrapper.appendChild(indicator);
        messageGroup.appendChild(wrapper);
        chatBody.appendChild(messageGroup);
        scrollToBottom();
    }

    function removeTypingIndicator() {
        const indicator = document.getElementById("typingIndicator");
        if (indicator) {
            indicator.remove();
        }
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        userInput.value = "";
        sendBtn.disabled = true;

        appendMessage("user", text);
        conversationHistory.push({ role: "user", content: text });

        showTypingIndicator();

        try {
            const response = await fetch(`https://api-inference.huggingface.co/models/${MODEL_ID}/v1/chat/completions`, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${HF_TOKEN}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: MODEL_ID,
                    messages: conversationHistory,
                    max_tokens: 2048,
                    temperature: 0.7,
                    top_p: 0.95
                })
            });

            removeTypingIndicator();

            if (!response.ok) {
                const errorData = await response.json();
                appendMessage("ai", `⚠️ Erreur: ${errorData.error?.message || "Impossible de contacter le modèle. Vérifiez votre jeton HF_TOKEN."}`);
                sendBtn.disabled = false;
                return;
            }

            const data = await response.json();
            const aiMessage = data.choices[0].message.content;

            appendMessage("ai", aiMessage);
            conversationHistory.push({ role: "assistant", content: aiMessage });

        } catch (error) {
            removeTypingIndicator();
            appendMessage("ai", "⚠️ Erreur réseau: Vérifiez votre connexion et votre jeton HF_TOKEN.");
            console.error(error);
        } finally {
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    userInput.focus();
</script>

</body>
</html>
